openapi: 3.1.0
info:
  title: PalCenter Companion API
  version: 1.0.0
  description: >-
    Contract for the optional PalCenter Companion discovery listener. Version
    0.1.0 exposes no gameplay information.
servers:
  - url: /palcenter/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check Companion availability
      responses:
        "200":
          description: The Companion can serve API requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /version:
    get:
      security: [{ bearerAuth: [] }]
      operationId: getVersion
      summary: Read application and API versions
      responses:
        "200":
          description: Version metadata for compatibility negotiation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /capabilities:
    get:
      security: [{ bearerAuth: [] }]
      operationId: getCapabilities
      summary: Discover available authoritative capabilities
      responses:
        "200":
          description: Explicitly supported Companion capabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Unauthorized:
      description: Missing or invalid bearer authentication.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: healthy
    VersionResponse:
      type: object
      additionalProperties: false
      required:
        - application
        - applicationVersion
        - apiVersion
        - compatibility
      properties:
        application:
          type: string
          const: palcenter-companion
        applicationVersion:
          type: string
          pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?$"
          examples:
            - 0.1.0
        apiVersion:
          type: string
          const: v1
        buildCommit:
          type: string
        buildBranch:
          type: string
        buildDate:
          type: string
        compiler:
          type: string
        palworldVersion:
          type: [string, "null"]
        ue4ssVersion:
          type: [string, "null"]
        compatibility:
          type: object
          additionalProperties:
            type: string
        runtime:
          type: object
          additionalProperties: true
    CapabilitiesResponse:
      type: object
      additionalProperties: true
      required: [schemaVersion, categories]
      properties:
        schemaVersion:
          type: string
        categories:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Capability"
    Capability:
      type: object
      required: [supported, capabilityVersion]
      properties:
        supported:
          type: boolean
        capabilityVersion:
          type: string
      additionalProperties: true
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
