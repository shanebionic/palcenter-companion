openapi: 3.1.0
info:
  title: PalCenter Companion API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: >-
    Contract for the optional PalCenter Companion listener. Version 0.3.2
    resolves safe runtime height for verified Palpagos map teleports.
servers:
  - url: /palcenter/v1
paths:
  /health:
    get:
      security: []
      operationId: getHealth
      summary: Check Companion availability
      responses:
        "200":
          description: The Companion can serve API requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /version:
    get:
      security: [{ bearerAuth: [] }]
      operationId: getVersion
      summary: Read application and API versions
      responses:
        "200":
          description: Version metadata for compatibility negotiation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /capabilities:
    get:
      security: [{ bearerAuth: [] }]
      operationId: getCapabilities
      summary: Discover available authoritative capabilities
      responses:
        "200":
          description: Explicitly supported Companion capabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /activity:
    get:
      security: [{ bearerAuth: [] }]
      operationId: getPlayerActivity
      summary: Read recent player activity
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - in: query
          name: after
          description: Return records newer than this UTC timestamp.
          schema: { type: string, format: date-time }
        - in: query
          name: player
          description: Match a stable user ID or player ID.
          schema: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Chronological records retained by the bounded in-memory buffer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityResponse" }
        "400":
          description: Invalid query parameters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin-actions/teleport-admin-to-player:
    post:
      security: [{ bearerAuth: [] }]
      operationId: teleportAdminToPlayer
      summary: Teleport an administrator character to an online player
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlayerTeleportRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminActionCompleted" }
        "400": { $ref: "#/components/responses/AdminActionRejected" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminActionRejected" }
        "409": { $ref: "#/components/responses/AdminActionRejected" }
        "422": { $ref: "#/components/responses/AdminActionRejected" }
        "501": { $ref: "#/components/responses/AdminActionRejected" }
        "503": { $ref: "#/components/responses/AdminActionRejected" }
  /admin-actions/teleport-player-to-admin:
    post:
      security: [{ bearerAuth: [] }]
      operationId: teleportPlayerToAdmin
      summary: Teleport an online player to an administrator character
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlayerTeleportRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminActionCompleted" }
        "400": { $ref: "#/components/responses/AdminActionRejected" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminActionRejected" }
        "409": { $ref: "#/components/responses/AdminActionRejected" }
        "422": { $ref: "#/components/responses/AdminActionRejected" }
        "501": { $ref: "#/components/responses/AdminActionRejected" }
        "503": { $ref: "#/components/responses/AdminActionRejected" }
  /admin-actions/teleport-player-to-location:
    post:
      security: [{ bearerAuth: [] }]
      operationId: teleportPlayerToLocation
      summary: Teleport an online player to a verified Palpagos location
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationTeleportRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminActionCompleted" }
        "400": { $ref: "#/components/responses/AdminActionRejected" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminActionRejected" }
        "409": { $ref: "#/components/responses/AdminActionRejected" }
        "422": { $ref: "#/components/responses/AdminActionRejected" }
        "501": { $ref: "#/components/responses/AdminActionRejected" }
        "503": { $ref: "#/components/responses/AdminActionRejected" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Unauthorized:
      description: Missing or invalid bearer authentication.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AdminActionCompleted:
      description: The teleport completed once on the game thread.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminActionResponse" }
    AdminActionRejected:
      description: The teleport was not executed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminActionResponse" }
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: healthy
    VersionResponse:
      type: object
      additionalProperties: false
      required:
        - application
        - applicationVersion
        - apiVersion
        - compatibility
      properties:
        application:
          type: string
          const: palcenter-companion
        applicationVersion:
          type: string
          pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?$"
          examples:
            - 0.3.2
        apiVersion:
          type: string
          const: v1
        buildCommit:
          type: string
        buildBranch:
          type: string
        buildDate:
          type: string
        compiler:
          type: string
        palworldVersion:
          type: [string, "null"]
        ue4ssVersion:
          type: [string, "null"]
        compatibility:
          type: object
          additionalProperties:
            type: string
        runtime:
          type: object
          additionalProperties: true
    CapabilitiesResponse:
      type: object
      additionalProperties: true
      required: [schemaVersion, categories]
      properties:
        schemaVersion:
          type: string
        categories:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Capability"
    Capability:
      type: object
      required: [supported, capabilityVersion]
      properties:
        supported:
          type: boolean
        capabilityVersion:
          type: string
        diagnostics:
          type: object
          description: >-
            Additive, non-secret reason codes for currently unavailable
            sub-capabilities. Consumers must ignore unknown codes.
          additionalProperties:
            oneOf:
              - type: string
              - type: "null"
      additionalProperties: true
    ActivityResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, restartBehavior, activity, oldestTimestamp, newestTimestamp]
      properties:
        schemaVersion: { type: string, const: "1" }
        restartBehavior: { type: string, const: memory_only }
        activity:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/PlayerActivity" }
        oldestTimestamp: { type: [string, "null"], format: date-time }
        newestTimestamp: { type: [string, "null"], format: date-time }
    PlayerActivity:
      type: object
      additionalProperties: false
      required: [eventId, eventType, timestamp, serverInstanceId, player, sessionId, source, schemaVersion, durationSeconds, metadata]
      properties:
        eventId: { type: string }
        eventType:
          type: string
          enum: [player_joined, player_left, session_started, session_ended]
        timestamp: { type: string, format: date-time }
        serverInstanceId: { type: string }
        player:
          type: object
          additionalProperties: false
          required: [userId, playerId, name]
          properties:
            userId: { type: [string, "null"] }
            playerId: { type: [string, "null"] }
            name: { type: string }
        sessionId: { type: string }
        source: { type: string, const: palworld_server_hook }
        schemaVersion: { type: string, const: "1" }
        durationSeconds:
          type: [integer, "null"]
          minimum: 0
          description: Whole elapsed seconds for departure and session-end records; null otherwise.
        metadata: { type: object, additionalProperties: true }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
    PlayerTeleportRequest:
      type: object
      additionalProperties: false
      required: [requestId, administratorPlayerId, targetPlayerId]
      properties:
        requestId:
          type: string
          minLength: 8
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]+$"
        administratorPlayerId: { $ref: "#/components/schemas/StablePlayerId" }
        targetPlayerId: { $ref: "#/components/schemas/StablePlayerId" }
    LocationTeleportRequest:
      type: object
      additionalProperties: false
      required: [requestId, administratorPlayerId, targetPlayerId, coordinateSpace, x, y, verification]
      properties:
        requestId:
          type: string
          minLength: 8
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]+$"
        administratorPlayerId: { $ref: "#/components/schemas/StablePlayerId" }
        targetPlayerId: { $ref: "#/components/schemas/StablePlayerId" }
        coordinateSpace: { type: string, const: palpagos }
        x: { type: number, minimum: -999940, maximum: 447900 }
        y: { type: number, minimum: -738920, maximum: 708920 }
        verification: { type: string, const: palpagos_map }
    StablePlayerId:
      type: string
      pattern: "^[0-9A-Fa-f]{32}$"
    AdminActionResponse:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - requestId
        - action
        - status
        - replayed
        - error
        - message
        - sourceCoordinateSpace
        - destinationCoordinateSpace
        - resolvedDestination
      properties:
        schemaVersion: { type: string, const: "1" }
        requestId: { type: string }
        action:
          type: string
          enum:
            - teleportAdminToPlayer
            - teleportPlayerToAdmin
            - teleportPlayerToLocation
        status: { type: string, enum: [succeeded, rejected] }
        replayed: { type: boolean }
        error: { type: [string, "null"] }
        message: { type: string }
        sourceCoordinateSpace: { type: [string, "null"] }
        destinationCoordinateSpace: { type: [string, "null"] }
        resolvedDestination:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [x, y, z]
              properties:
                x: { type: number }
                y: { type: number }
                z: { type: number }
